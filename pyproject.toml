[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "libero-ctrl"
version = "0.1.0"
description = "LIBERO-CTRL: a severity-calibrated, paired, controlled robustness benchmark for VLA policies"
readme = "README.md"
requires-python = ">=3.9"
# LIBERO itself (robosuite 1.4.0 / MuJoCo 2.3.7) is deliberately NOT a dependency. The user is
# assumed to already have a working LIBERO environment, and this package is installed into it.
# Pulling robosuite in here would change the versions of that working evaluation environment.
dependencies = ["numpy", "scipy", "pillow"]

[project.scripts]
libero-ctrl = "libero_ctrl.cli:main"

[tool.setuptools.packages.find]
include = ["libero_ctrl*"]

[tool.setuptools.package-data]
libero_ctrl = ["py.typed"]
